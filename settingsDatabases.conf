//WINDOWS
//2. Permitir conexiones en el firewall de Windows

Abre el Firewall de Windows.

Permite el puerto de la base de datos:

MySQL: 3306

PostgreSQL: 5432

O con PowerShell:

// PowerShell
New-NetFirewallRule -DisplayName "MySQL" -Direction Inbound -LocalPort 3306 -Protocol TCP -Action Allow
New-NetFirewallRule -DisplayName "Postgresql" -Direction Inbound -LocalPort 5432 -Protocol TCP -Action Allow
//LINUX
//3. Conéctate desde Ubuntu

Instala el cliente correspondiente:
sudo apt update 
sudo apt install postgresql-client
psql -h <IP_WINDOWS> -U <usuario> -d <nombre_db>